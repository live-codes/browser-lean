<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lean 4 in the browser</title>
    <meta
      name="description"
      content="Runs the real Lean 4 kernel entirely in the browser via WebAssembly. No server compiles anything."
    />
    <!--
      No third-party JavaScript and no import map: the page is a Worker plus this
      file. The Lean artifacts are mirrored locally by `npm run assets` (see the
      package's bin/fetch-assets.mjs) — they cannot be hotlinked, because upstream
      serves the binaries with `Cross-Origin-Resource-Policy: same-origin` and no
      `Access-Control-Allow-Origin`.
    -->
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f26;
        --panel-2: #232732;
        --line: #2e3340;
        --text: #e6e8ee;
        --muted: #98a0b3;
        --accent: #4c8dff;
        --ok: #4bd07a;
        --warn: #f0b429;
        --err: #ff6b6b;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 { font-size: 15px; margin: 0; font-weight: 600; }
      .sub { color: var(--muted); font-size: 12px; }
      .grow { flex: 1; }
      #banner {
        padding: 10px 16px;
        background: #3a2a12;
        border-bottom: 1px solid #6b4c12;
        color: #ffd98a;
        font-size: 13px;
        display: none;
      }
      #banner.show { display: block; }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 1px;
        background: var(--line);
        min-height: 0;
      }
      @media (max-width: 900px) {
        main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
      }
      section { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .bar label { color: var(--muted); font-size: 12px; }
      select, button, input[type="text"] {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
        font: inherit;
        font-size: 13px;
      }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button.primary:hover:not(:disabled) { filter: brightness(1.1); }
      #editor {
        flex: 1;
        width: 100%;
        min-height: 0;
        resize: none;
        border: 0;
        outline: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
      }
      .panes { flex: 1; overflow: auto; min-height: 0; }
      .pane { padding: 10px 14px; border-bottom: 1px solid var(--line); }
      .pane h2 {
        margin: 0 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }
      pre {
        margin: 0;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #output.empty, #diagnostics.empty, #log.empty { color: var(--muted); font-style: italic; }
      #diagnostics { color: #ffb4b4; }
      #log { color: var(--muted); font-size: 12px; }
      #status { font-family: var(--mono); font-size: 12px; color: var(--muted); width: 100%; }
      #status.busy { color: var(--warn); }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }
      .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .pill.bad { border-color: #6b3a3a; color: #ff9b9b; }
      .pill.good { border-color: #2f5a3f; color: #9be0b4; }
      a { color: var(--accent); }
      kbd {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
        font-family: var(--mono);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Lean 4 in the browser</h1>
      <span class="sub">the real kernel, compiled to WebAssembly — no server checks your proofs</span>
      <span class="grow"></span>
      <span id="isolation" class="pill"></span>
      <span id="payload" class="pill"></span>
    </header>

    <div id="banner"></div>

    <main>
      <section>
        <div class="bar">
          <select id="examples" aria-label="Examples"></select>
          <button id="run" class="primary">Run</button>
          <button id="clear">Clear output</button>
          <span class="grow"></span>
          <span class="meta"><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>Enter</kbd> to run</span>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </section>

      <section>
        <div class="bar">
          <span id="status">Ready.</span>
        </div>
        <div class="panes">
          <div class="pane">
            <h2>Output</h2>
            <pre id="output" class="empty">Run something.</pre>
          </div>
          <div class="pane">
            <h2>Diagnostics</h2>
            <pre id="diagnostics" class="empty">Nothing yet.</pre>
          </div>
          <div class="pane">
            <h2>Log</h2>
            <pre id="log" class="empty">Toolchain not loaded.</pre>
          </div>
        </div>
      </section>
    </main>

    <!--
      The package's IIFE build, copied in by `npm run sync:vendor` so this directory is deployable as
      it stands. A static host serves files rather than routes: it cannot reach `packages/`, and a
      path like `/vendor/lean-wasm/src/index.js` comes back as the host's HTML fallback, which the
      browser refuses to run as a module for having MIME type `text/html`.
    -->
    <script src="./vendor/lean-wasm.global.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
